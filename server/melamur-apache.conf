# MelaMur aggregator behind Apache2 + mod_wsgi, with mutual TLS.
#
# Prereqs (Debian/Ubuntu):
#   sudo apt install apache2 libapache2-mod-wsgi-py3 python3-pymysql
#   sudo a2enmod ssl wsgi headers
# Put a real server certificate for melamur.snel.it in place of the paths below
# (e.g. from Let's Encrypt). The client CA is server/certs/client-ca.pem, which
# verifies the certificate the app presents (see server/make_certs.sh).
#
# Then: sudo cp melamur-apache.conf /etc/apache2/sites-available/melamur.conf
#       sudo a2ensite melamur && sudo systemctl reload apache2

<VirtualHost *:443>
    ServerName melamur.snel.it

    SSLEngine on
    SSLCertificateFile      /etc/ssl/melamur/server.pem
    SSLCertificateKeyFile   /etc/ssl/melamur/server.key

    # ---- mutual TLS: require a client cert signed by our client CA
    SSLCACertificateFile    /etc/ssl/melamur/client-ca.pem
    SSLVerifyClient         require
    SSLVerifyDepth          2
    # export SSL_CLIENT_* vars (SSL_CLIENT_VERIFY, SSL_CLIENT_S_DN_CN) to WSGI
    SSLOptions              +StdEnvVars +ExportCertData

    # ---- the WSGI app
    WSGIDaemonProcess melamur processes=2 threads=8 display-name=%{GROUP} \
        python-home=/usr python-path=/opt/melamur/server
    WSGIProcessGroup  melamur
    WSGIScriptAlias   /aggregator /opt/melamur/server/melamur.wsgi

    SetEnv MELAMUR_DB_HOST 127.0.0.1
    SetEnv MELAMUR_DB_NAME melamur
    SetEnv MELAMUR_DB_USER melamur
    SetEnv MELAMUR_DB_PASS change-me
    SetEnv MELAMUR_REQUIRE_CLIENT_CERT 1

    <Directory /opt/melamur/server>
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/melamur_error.log
    CustomLog ${APACHE_LOG_DIR}/melamur_access.log combined
</VirtualHost>
