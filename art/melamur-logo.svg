<?xml version="1.0" encoding="UTF-8"?>
<!-- MelaMur logo — master SVG. Red outline of a modern bus travelling LEFT
     (Malta drives on the left; front is the left end), wheels tucked into
     wheel-wells (no tops, body does not show through), motion lines trailing at
     the back (right). No doors or windows. The Android launcher/app icon
     (app/src/main/res/drawable/ic_logo.xml) is generated from these paths. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"
     fill="none" stroke="#E10600" stroke-linejoin="round" stroke-linecap="round">
  <!-- body with wheel-wells arched into the underside -->
  <path stroke-width="2.1"
        d="M11.5,13.5 L38.5,13.5 Q41,13.5 41,16 L41,27.5 Q41,30 38.5,30 L35.9,30
           A3.9,3.9 0 0 0 28.1,30 L18.4,30 A3.9,3.9 0 0 0 10.6,30 L8,30
           Q5.5,30 5.5,27.5 L5.5,19.5 Q5.5,13.5 11.5,13.5 Z"/>
  <!-- wheels: lower arc only, tops hidden in the wells -->
  <path stroke-width="1.8"
        d="M17.10,28.50 A3,3 0 1 1 11.90,28.50 M34.60,28.50 A3,3 0 1 1 29.40,28.50"/>
  <!-- motion lines at the back -->
  <path stroke-width="1.8"
        d="M43,17.5 L46.8,17.5 M44,22.5 L47.4,22.5 M43,27.5 L46.8,27.5"/>
</svg>
