name: Release
# Push a tag like v0.2.0 to build a signed APK and publish it as a GitHub release.
# "Run workflow" (manual) builds and uploads the signed APK as an artifact only.
# Needs the four MELAMUR_* secrets; see docs/release-signing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.MELAMUR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret MELAMUR_KEYSTORE_BASE64 is not set (see docs/release-signing.md)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MELAMUR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          MELAMUR_KEYSTORE_PASSWORD: ${{ secrets.MELAMUR_KEYSTORE_PASSWORD }}
          MELAMUR_KEY_ALIAS: ${{ secrets.MELAMUR_KEY_ALIAS }}
          MELAMUR_KEY_PASSWORD: ${{ secrets.MELAMUR_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VN="${GITHUB_REF_NAME#v}"; else VN="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          # versionCode must grow with every release; the run number of this workflow does
          gradle --no-daemon assembleRelease -PmelamurVersionName="$VN" -PmelamurVersionCode="$GITHUB_RUN_NUMBER"

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK was produced"; ls -la app/build/outputs/apk/release; exit 1
          fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          # show the certificate fingerprint in keytool's format (AB:CD:...), so it can be
          # compared with: keytool -list -v -keystore melamur-release.jks -alias melamur
          FP=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | tr a-f A-F | sed 's/../&:/g; s/:$//')
          DN=$(sed -n 's/^Signer #1 certificate DN: //p' "$RUNNER_TEMP/certs.txt")
          echo "::notice title=Signing certificate::SHA256 $FP ($DN)"
          printf '### Signing certificate\n\n`%s`\n\nSHA256: `%s`\n' "$DN" "$FP" >> "$GITHUB_STEP_SUMMARY"
          # fixed name, so .../releases/latest/download/melamur.apk is always the newest
          cp "$APK" melamur.apk

      - uses: actions/upload-artifact@v4
        with: { name: melamur-release-apk, path: melamur.apk }

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" melamur.apk --title "MelaMur $GITHUB_REF_NAME" --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
